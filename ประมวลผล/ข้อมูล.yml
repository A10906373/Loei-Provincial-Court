== Instrumentation and events data ==
{{Colored box
|title = View and query events data
|content = Through the [[Event Platform]] and [[Metrics Platform]], you can create and deploy your own instruments to collect event data. 

Events are [[Data Engineering/Systems/Hadoop Event Ingestion Lifecycle|ingested]] into <code>event</code> and <code>event_sanitized</code> databases in the [[Data_Platform/Data Lake|Data Lake]].
* The Hive table name is a normalized version of the stream name.
* The <code>event</code>database stores original (unsanitized) events within a 90 day retention period.
* The <code>event_sanitized</code> database is an archive of sanitized events, beyond the 90 day retention period.
** [[Data_Platform/Systems/Event Sanitization|Sanitized event data]] is processed per WMF’s [[foundation:Privacy_policy|Privacy Policy]] and [[metawiki:Data_retention_guidelines|Data Retention Guidelines]].

After the data becomes available, you can [[Data_Platform/Analyze_data|access it with standard query tools]] and [[Data_Platform/Transform_data#Share_data_and_dashboards|create dashboards based on the data]].
See the [[Event_Platform/Instrumentation_How_To#Viewing_and_querying_events|Instrumentation tutorial]] for how to consume events directly from [[Kafka]] or through the internal [[EventStreams]] instance. 
}}

