{{anchor|introduction}}
==<span class="nomobile">[[File:WMF open door.png|60px]]</span> <translate><!--T:87-->
Introduction</translate>==

{{Privacypolicy/Rheader
| content =
{{anchor|welcome}}
===<translate><!--T:29--> Welcome!</translate>===
}}
{{Privacypolicy/Left|content=
<translate><!--T:186-->
The Wikimedia Foundation is the nonprofit organization that operates collaborative, free knowledge websites, like [[<tvar name="Wikipedia">{{lwp|Main Page}}</tvar>|Wikipedia]], [[<tvar name="Commons">:c:Main Page</tvar>|Wikimedia Commons]], and [[<tvar name="Wiktionary">:wikt:Wiktionary:Main Page</tvar>|Wiktionary]].

<!--T:187-->
This Policy explains how we collect, use, and share your Personal Information.
</translate>

* <translate><!--T:188--> We collect very little Personal Information about you.</translate>
* <translate><!--T:189--> We do not rent or sell your Personal Information to third parties.</translate>

<translate><!--T:190-->
By using Wikimedia Sites, you confirm that you have read and understood this Policy.</translate>
}}
{{Privacypolicy/Right
| arrow text = {{int string|Back to top}}
| content =
<translate>
<!--T:30-->
The Wikimedia movement is founded on a simple, but powerful principle: we can do more together than any of us can do alone. We cannot work collectively without gathering, sharing, and analyzing information about our users as we seek new ways to make the Wikimedia Sites more usable, safer, and more beneficial.

<!--T:31-->
We believe that information-gathering and use should go hand-in-hand with transparency. This Privacy Policy explains how the Wikimedia Foundation, the non-profit organization that hosts the Wikimedia Sites, like Wikipedia, collects, uses, and shares information we receive from you through your use of the Wikimedia Sites. It is essential to understand that when you use any of the Wikimedia Sites, we collect, transfer, process, store, disclose, and use your information as described in this Privacy Policy. That means that reading this Policy carefully is important.

<!--T:32-->
We believe that you should not have to provide nonpublic Personal Information to participate in the free knowledge movement. You do not have to provide things like your real name, address, or date of birth to sign up for a standard account or contribute content to the Wikimedia Sites.
</translate>

{{anchor|donotsell}}<translate>
<!--T:33-->
We do not sell or rent your Personal Information, nor do we give it to others to sell you anything. We use it to figure out how to make the Wikimedia Sites more engaging and accessible, to see which ideas work, and to make learning and contributing more fun. Put simply: we use this information to make the Wikimedia Sites better for you.

<!--T:34-->
After all, it is people like you, the champions of free knowledge, who make it possible for the Wikimedia Sites to not only exist, but also grow and thrive.
</translate>

{{anchor|definitions}}{{anchor|Definitions}}
====<translate><!--T:35--> Definitions</translate>====
}}

{{Privacypolicy/Left|content=
<translate><!--T:248-->
We recognize that only a minority of you are familiar with technical terms like "tracking pixels" and "cookies" used in the Privacy Policy.</translate>

<translate><!--T:288--> Whether you are brand new to privacy terminology or you are an expert who just wants a refresher, you might find our [[<tvar name="Glossary">Special:MyLanguage/Policy:Privacy policy/Glossary of key terms</tvar>|Glossary of Key Terms]] helpful.</translate>}}

{{Privacypolicy/Right|content=
<translate><!--T:36-->
Because everyone (not just lawyers) should be able to easily understand how and why their information is collected and used, we use common language instead of more formal terms throughout this Policy. To help ensure your understanding of some particular key terms, here is a table of translations:</translate>

{{Policy:Privacy policy/Definitions}}

{{anchor|coverage}}
====<translate><!--T:58--> What This Privacy Policy Does and Does Not Cover</translate>====

<translate><!--T:59-->
Except as explained below, this Privacy Policy applies to our collection and handling of information about you that we receive as a result of your use of any of the Wikimedia Sites. This Policy also applies to information that we receive from our partners or other third parties. To understand more about what this Privacy Policy covers, please see below.</translate>

{{Hidden
|header=<translate><!--T:60--> Examples of What This Privacy Policy Covers</translate>
|content=

<translate><!--T:61--> For the sake of clarity, this Privacy Policy covers, regardless of language:</translate>
* <translate><!--T:62--> All of our major sites (found at [[<tvar name="majorprojects">:m:Special:MyLanguage/Projects</tvar>|list of major projects]]), such as Wikipedia, including user pages, discussion pages, and noticeboards.</translate>
* <translate><!--T:63--> Our blogs and APIs (unless we have provided a separate policy for those services).</translate>
* <translate><!--T:64--> Official Wikimedia Foundation mobile applications.</translate>
* <translate><!--T:65--> Emails, SMS, and notifications from us or sent to us from you.</translate>
}}

<translate><!--T:66-->
This Privacy Policy, however, does not cover some situations where we may gather or process information. For example, some uses may be covered by separate privacy policies (like those of the [<tvar name="shoplink">//shop.wikimedia.org</tvar> Wikimedia Shop]) or sites or services run by third parties (such as third-party developer projects on [<tvar name="labslink">//labs.wikimedia.org</tvar> Wikimedia Cloud Services]). To understand more about what this Privacy Policy does not cover, please see below.
</translate>

{{anchor|More On What This Privacy Policy Doesn't Cover}}
{{Policy:Privacy policy/What policy does not cover}}

<translate><!--T:185-->
Where community policies govern information, such as the [[<tvar name="CheckUser-policy">:m:Special:MyLanguage/CheckUser policy</tvar>|CheckUser policy]], the relevant community may add to the rules and obligations set out in this Policy. However, they are not permitted to create new exceptions or otherwise reduce the protections offered by this Policy.</translate>
| arrow text = {{int string|Back to top}}
}}
{{anchor|use}}
==<span class="nomobile">[[File:WMF chart.png|60px]]</span> <translate><!--T:89--> Collection & Use of Info</translate>==
{{Privacypolicy/Rheader
| content =
{{anchor|types-of-info}}
===<translate><!--T:90--> Types of Information We Receive From You & How We Get It</translate>===

{{anchor|your-public-contribs}}
====<translate><!--T:91--> Your Public Contributions</translate>====
}}
{{Privacypolicy/Left|content=
<translate><!--T:191-->
Whatever you post on Wikimedia Sites can be seen and used by everyone.</translate>
}}
{{Privacypolicy/Right
| content =
<translate><!--T:93-->
When you make a contribution to any Wikimedia Site, including on user or discussion pages, you are creating a permanent, public record of every piece of content added, removed, or altered by you. The page history will show when your contribution or deletion was made, as well as your username (if you are signed in) or your temporary account username (if you are not signed in). We may use your public contributions, either aggregated with the public contributions of others or individually, to create new features or data-related products for you or to learn more about how the Wikimedia Sites are used, as further explained below in the [[<tvar name="use">#infowereceive</tvar>|"How We Use Information We Receive From You"]] section of this Privacy Policy.</translate>

{{Hidden
|header=<translate><!--T:284--> Publicly Visible Information</translate>
|content=<translate><!--T:94-->
Unless this Policy says otherwise, you should assume that information that you actively contribute to the Wikimedia Sites, including Personal Information, is publicly visible and can be found by search engines. Like most things on the Internet, anything you share may be copied and redistributed throughout the Internet by other people. Please do not contribute any information that you are uncomfortable making permanently public, like revealing your real name or location in your contributions.

<!--T:239-->
You should be aware that specific data made public by you or aggregated data that is made public by us can be used by anyone for analysis and to infer further information, such as which country a user is from, political affiliation and gender.</translate>
}}
| arrow text = {{int string|Back to top}}
}}
{{Privacypolicy/Rheader
| content =
{{anchor|your-account-info}}
====<translate><!--T:95--> Account Information & Registration</translate>====
}}
{{Privacypolicy/Left|content=
<translate>
<!--T:193-->
You do not need to create an account to use any Wikimedia Site.

<!--T:194-->
If you do create an account, you do not need to give us your name or email address (although you can if you choose to, such as for the "Email this user" feature for example).

<!--T:195-->
If you do not create an account, your contributions will be publicly attributed to your temporary account.</translate>
}}
{{Privacypolicy/Right|content=
<translate><!--T:96-->
Want to create an account? Great! Do not want to create an account? No problem!</translate>

{{anchor|notrequired}}
<translate><!--T:97-->
You are not required to create an account to read or contribute to a Wikimedia Site, except under [[<tvar name="needaccount">Special:MyLanguage/Policy:Privacy policy/Frequently asked questions#needaccount</tvar>|rare circumstances]]. However, if you contribute without signing in, your contribution will be publicly attributed to a [[<tvar name="1">Special:MyLanguage/Policy:Privacy_policy/Frequently_asked_questions#standardaccount</tvar>|temporary account]] associated with your browser.</translate>

{{anchor|noaccount}}
<translate><!--T:98-->
If you want to create a [[<tvar name="standardaccount">Special:MyLanguage/Policy:Privacy policy/Frequently asked questions#standardaccount</tvar>|standard account]], in most cases we require only a username and a password. However, if you choose not to provide an email address, we cannot help you recover your password.</translate>

{{Hidden
|header=<translate><!--T:285--> More on Usernames</translate>
|content=<translate><!--T:250-->
Your username will be publicly visible, so please be careful about revealing your real name or other Personal Information in your username. Your password is only used to verify that the account is yours. Your [[<tvar name="GlossaryIP">Special:MyLanguage/Policy:Privacy policy/Glossary of key terms#ip-address</tvar>|IP address]] is also automatically submitted to us, and we record it temporarily. This is to protect Wikimedia users and project content; in the event of abuse, IP addresses may be associated with usernames as part of an investigation. No other Personal Information is required: no name, no email address, no date of birth, and no credit card information.</translate>

<translate><!--T:99-->
Once created, user accounts cannot be removed entirely (although you can usually hide the information on your user page if you choose to). This is because your public contributions must be associated with their author (you!). In some circumstances, the Wikimedia communities [[<tvar name="righttovanish">:m:Special:MyLanguage/Right to vanish</tvar>|can assist]] users with removing additional information related to their account from the projects.</translate>
}}

<translate><!--T:100-->
To gain a better understanding of the demographics of our users, to localize our services and to learn how we can improve our services, we may ask you for more demographic information, such as gender or age, about yourself. We will tell you if such information is intended to be public or private, so that you can make an informed decision about whether you want to provide us with that information. Providing such information is always completely optional. If you do not want to, you do not have to—it is as simple as that.</translate>
|arrow text={{int string|Back to top}}
}}

{{Privacypolicy/Rheader|content=
{{anchor|location-info}}
====<translate><!--T:125--> Location Information</translate>====
}}

{{Privacypolicy/Rheader|content=
{{anchor|GPS}}
=====<translate><!--T:126--> GPS & Other Location Technologies</translate>=====
}}
{{Privacypolicy/Left|content=
<translate><!--T:210-->
Some features we offer work better if we know what area you are in.</translate>
}}
{{Privacypolicy/Right|content=
<translate><!--T:127-->
If you consent, we can use [[<tvar name="GlossaryGPS">Special:MyLanguage/Policy:Privacy policy/Glossary of key terms#gps</tvar>|GPS]] (and other technologies commonly used to determine location) to show you more relevant content. We keep information obtained by these technologies confidential, except as provided in this Policy. You can learn more by checking out the list of examples of how we use these technologies in our [[<tvar name="gpsexamplesFAQ">Special:MyLanguage/Policy:Privacy policy/Frequently asked questions#gpsexamplesFAQ</tvar>|FAQ]].</translate>
| arrow text = {{int string|Back to top}}
}}

{{Privacypolicy/Rheader|content=
{{anchor|metadata}}
===== <translate><!--T:128--> Metadata</translate> =====
}}
{{Privacypolicy/Right|content=
<translate><!--T:129-->
Sometimes, we automatically receive location data from your device. For example, if you want to upload a photo on the Wikimedia Commons mobile app, we may receive [[<tvar name="GlossaryMD">Special:MyLanguage/Policy:Privacy policy/Glossary of key terms#metadata</tvar>|metadata]], such as the place and time you took the photo, automatically from your device. Please be aware that, unlike location information collected using GPS signals described above, the default setting on your mobile device typically includes the metadata in your photo or video upload to the Wikimedia Sites. If you do not want metadata sent to us and made public at the time of your upload, please change your settings on your device.</translate>
| arrow text = {{int string|Back to top}}
}}

{{Privacypolicy/Rheader|content=
{{anchor|ipinfouse}}
=====<translate><!--T:130--> IP Addresses</translate>=====
}}
{{Privacypolicy/Right|content=
<translate><!--T:131-->
Finally, when you visit any Wikimedia Site, we automatically receive the [[<tvar name="GlossaryIP">Special:MyLanguage/Policy:Privacy policy/Glossary of key terms#ip-address</tvar>|IP address]] of the device (or your [[<tvar name="GlossaryProxy">Special:MyLanguage/Policy:Privacy policy/Glossary of key terms#proxy-servers</tvar>|proxy server]]) you are using to access the Internet, which could be used to [[<tvar name="inferlocationFAQ">Special:MyLanguage/Policy:Privacy policy/Frequently asked questions#inferlocationFAQ</tvar>|infer your geographical location]].</translate>

| arrow text = {{int string|Back to top}}
}}

{{Privacypolicy/Rheader|content=
{{anchor|your-use-of-wm-sites}}
===<translate><!--T:101--> Information Related to Your Use of the Wikimedia Sites</translate>===
}}
{{Privacypolicy/Left|content=
<translate><!--T:197-->
We use certain technologies to collect information about how you use Wikimedia Sites.

<!--T:200-->
Like other websites, we receive some information about you automatically when you visit the Wikimedia Sites.

<!--T:252-->
We also use a variety of commonly-used technologies, like cookies, to collect information regarding how you use the Wikimedia Sites, make our services safer and easier to use, and to help create a better and more customizable experience for you.</translate>
}}
{{Privacypolicy/Right|content=
<translate><!--T:102-->
We want to make the Wikimedia Sites better for you by learning more about how you use them. Examples of this might include how often you visit the Wikimedia Sites, what you like, what you find helpful, how you get to the Wikimedia Sites, and whether you would use a helpful feature more if we explained it differently. We also want this Policy and our practices to reflect our community's values. For this reason, we keep information related to your use of the Wikimedia Sites confidential, except as provided in this Policy.</translate>
| arrow text = {{int string|Back to top}}
}}

{{Privacypolicy/Rheader|content=
{{anchor|info-received-automatically}}
====<translate><!--T:103--> Information We Receive Automatically</translate>====
}}
{{Privacypolicy/Right|content=
<translate><!--T:104-->
Because of how browsers work, we receive some information automatically when you visit the Wikimedia Sites. This includes when you use an online tool on a third-party site that loads information coming from the Wikimedia Sites. This information includes the type of device you are using (possibly including unique device identification numbers, for some beta versions of our mobile applications), the type and version of your [[<tvar name="GlossaryBrowser">Special:MyLanguage/Policy:Privacy policy/Glossary of key terms#browsers</tvar>|browser]], your browser's language preference, the type and version of your device's [[<tvar name="GlossaryOS">Special:MyLanguage/Policy:Privacy policy/Glossary of key terms#operating-system</tvar>|operating system]], in some cases the name of your internet service provider or mobile carrier, the website that referred you to the Wikimedia Sites, which pages you request and visit, and the date and time of each request you make to the Wikimedia Sites.</translate>

<translate><!--T:105-->
Put simply, we use this information to enhance your experience with Wikimedia Sites. For example, we use this information to administer the sites, provide greater security, and fight vandalism; optimize mobile applications, customize content and set language preferences, test features to see what works, and improve performance; understand how users interact with the Wikimedia Sites, track and study use of various features, gain understanding about the demographics of the different Wikimedia Sites, and analyze trends.</translate>
| arrow text = {{int string|Back to top}}
 }}

{{Privacypolicy/Rheader|content=
{{anchor|info-collected}}
====<translate><!--T:106--> Information We Collect</translate>====
}}
{{Privacypolicy/Left|content=
<translate><!--T:202-->
We use a variety of commonly-used technologies, like cookies, to understand how you use the Wikimedia Sites, make our services safer and easier to use, and to help create a better and more customizable experience for you.</translate>
}}
{{Privacypolicy/Right|content=
<translate>
<!--T:107-->
We actively collect some types of information with a variety of commonly-used technologies. These generally include:</translate>
* <translate><!--T:313--> [[<tvar name="GlossaryJS">Special:MyLanguage/Policy:Privacy policy/Glossary of key terms#javascript</tvar>|JavaScript]], which is used to enhance the security of our sites, provide analytic data, deliver our services, and ensure site reliability,</translate>
* <translate><!--T:314--> [[<tvar name="GlossaryCO">Special
