อาคารและการวิ่ง
หมายเหตุ: เวอร์ชัน Xcode ของคุณต้องมีอย่างน้อย 16.0 ในไดเร็กทอรี ให้เรียกใช้ ./สคริปต์/การตั้งค่า● หมายเหตุ: กําลังจะ สคริปต์ ไดเรกทอรีและการเรียกใช้ การตั้งค่า จะไม่ทํางานเนื่องจากเส้นทางสัมพัทธ์

วิ่ง สคริปต์/การตั้งค่า จะตั้งค่าคอมพิวเตอร์ของคุณเพื่อสร้างและเรียกใช้แอป สคริปต์ถือว่าคุณได้ติดตั้ง Xcode แล้ว มันจะติดตั้ง โฮมบรูว์, สวิฟท์ลินท์, และ รูปแบบ Clang● นอกจากนี้ยังจะสร้างฮุคก่อนคอมมิตที่ใช้ ClangFormat สําหรับการลงรหัส Objective-C

หลังจากวิ่ง สคริปต์/การตั้งค่า, คุณควรจะสามารถเปิด วิกิพีเดีย.xcodeproj และเรียกใช้แอปบน iOS Simulator (โดยใช้ วิกิพีเดีย โครงการและเป้าหมาย) หากคุณพบปัญหาใด ๆ โปรดอย่าลังเลที่จะแจ้งให้เราทราบผ่านทาง รายงานข้อผิดพลาด●

การพึ่งพาที่จําเป็น
หากคุณต้องการติดตั้งข้อกําหนดเบื้องต้นในการพัฒนาด้วยตัวเองโดยไม่ต้องใช้สคริปต์ของเรา:

**เอ็กซ์โค้ด** - วิธีที่ง่ายที่สุดในการรับ Xcode คือจาก แอพสโตร์, แต่คุณยังสามารถดาวน์โหลดได้จาก developer.apple.com หากคุณมี Apple ID ที่ลงทะเบียนกับบัญชี Apple Developer
**สวิฟท์ลินท์** - เราใช้นี่สําหรับ linting รหัสสวิฟท์
**ClangFormat** - เราใช้สิ่งนี้สําหรับการบุรหัส Objective-C
มีส่วนร่วม
ครอบคลุมอยู่ในของเรา เอกสารประกอบการบริจาค บนมีเดียวิกิ

แนวทางการพัฒนา
นี่เป็นแนวทางทั่วไปมากกว่ากฎเกณฑ์ที่เข้มงวด

แนวทางการเข้ารหัส
วัตถุประสงค์-C - แนวทางการเข้ารหัสของ Apple สําหรับโกโก้
รวดเร็ว - แนวทางการออกแบบ API ของ Swift.org
การจัดรูปแบบ
เราใช้การเยื้องช่องว่าง 4 เริ่มต้นของ Xcode และของเรา .รูปแบบ clang ไฟล์ที่มีการตั้งค่าเบ็ดล่วงหน้าโดย สคริปต์/การตั้งค่า● หากเป็นไปได้ รหัส Swift ของเราจะถูกฟอร์แมตโดยอัตโนมัติโดย สวิฟท์ลินท์ ตามกฎที่กําหนดไว้ใน .swiftlint-autocorrect.yml●

