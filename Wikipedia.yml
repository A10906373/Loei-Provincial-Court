🚨 ข้อผิดพลาด

แอปจะเขียนเฉพาะข้อความเตือนและข้อผิดพลาดไปยังคอนโซลสําหรับทั้งโหมดดีบักและโหมดวางจําหน่าย หากคุณต้องการบันทึกข้อความทั้งหมดชั่วคราวระหว่างการแก้ไขปัญหา ให้อัปเดต ระดับนี้ ถึง DDLogLevelAll
การทดสอบ
เดอะ วิกิพีเดีย scheme ได้รับการกําหนดค่าให้ดําเนินการทดสอบหน่วย iOS ของโปรเจ็กต์ ซึ่งสามารถรันได้โดยใช้ ซีเอ็มดี+ยู ฮอตคีย์หรือ ผลิตภัณฑ์ → การทดสอบ การกระทําแถบเมนู เพื่อให้การทดสอบผ่าน จะต้องตั้งค่าภาษาและภูมิภาคของอุปกรณ์ทดสอบ th-สหรัฐอเมริกา ในการตั้งค่า → ทั่วไป → ภาษาและภูมิภาค มี ยื่นตั๋วแล้ว เพื่ออัปเดตการทดสอบให้ผ่านโดยไม่คํานึงถึงภาษาและภูมิภาค

แผนงานและเป้าหมาย
วิกิพีเดีย - ชี้ไปที่เซิร์ฟเวอร์การผลิต
การแสดงละคร - ชี้ไปยังสภาพแวดล้อมเซิร์ฟเวอร์การจัดฉากต่างๆ คุณสามารถปรับสภาพแวดล้อมเหล่านี้ได้โดยการเปลี่ยน ปัจจุบัน [ทรัพย์สิน](WMF%20Framework/Configuration.swift#L41) ของ การกําหนดค่า:
ทางเลือกของ appsLabsForPCS จะชี้ไปที่ สภาพแวดล้อมการแสดงละครของทีมแอป สําหรับเนื้อหาของหน้า
ทางเลือกของ เบต้าคลัสเตอร์ จะชี้ไปที่ สภาพแวดล้อมคลัสเตอร์เบต้า MediaWiki สําหรับการเรียก API ส่วนใหญ่ นี่หมายถึงการตั้งค่าสภาพแวดล้อมแบบครอบคลุมมากขึ้น ดังนั้นหากมีค่านี้อยู่ ก็จะบังคับสภาพแวดล้อมคลัสเตอร์เบต้าสําหรับเนื้อหาเพจในมุมมองบทความด้วย สภาพแวดล้อมคลัสเตอร์เบต้านี้ยังเป็นที่ที่นักพัฒนาสามารถทดสอบการแจ้งเตือนแบบพุชแซนด์บ็อกซ์ที่ทริกเกอร์ผ่านวิกิต่างๆ สิ่งนี้ถูกเลือกตามค่าเริ่มต้น

รูปแบบการจัดเตรียมยังมีการตั้งค่าสถานะคุณลักษณะของเราให้เป็นจริงอีกด้วย มันแสดงคุณสมบัติที่ยังอยู่ในการพัฒนา มันถูกผลักไปที่ TestFlight เป็นแอปแยกต่างหาก
การทดลอง - สําหรับการสร้างครั้งเดียว, เพื่อแสดงให้เห็นถึงการพัฒนาในช่วงต้นหรือคุณสมบัติต้นแบบ สิ่งนี้ชี้ไปที่เซิร์ฟเวอร์ที่ใช้งานจริงตามค่าเริ่มต้น แต่สามารถปรับให้เข้ากับสภาพแวดล้อมเซิร์ฟเวอร์ใดก็ได้ที่จําเป็นผ่านการปรับเปลี่ยนชั่วคราว การกําหนดค่า● บางครั้งเรายังใช้มันเพื่อตรวจสอบการออกแบบ ก่อนที่ฟีเจอร์ต่างๆ จะผ่านการตรวจสอบการประชาสัมพันธ์ มันถูกผลักไปที่ TestFlight เป็นแอปแยกต่างหาก
บริการเนื้อหาหน้าท้องถิ่นและประกาศ - ใช้โดยวิศวกรใน Debug-mode เท่านั้น สิ่งนี้มีความสามารถในการสลับสภาพแวดล้อมท้องถิ่นที่แตกต่างกันภายใน ปัจจุบัน [ทรัพย์สิน](WMF%20Framework/Configuration.swift#L41) ของ การกําหนดค่า:
ทางเลือกของ localPCS จะชี้ไปที่การทํางานในพื้นที่ โมบายแอพ พื้นที่เก็บข้อมูลสําหรับเนื้อหาหน้า สิ่งนี้ถูกเลือกตามค่าเริ่มต้น
ทางเลือกของ ประกาศท้องถิ่น จะชี้ไปที่การทํางานในพื้นที่ วิกิฟีดส์ พื้นที่เก็บข้อมูลสําหรับจุดสิ้นสุดการประกาศ สิ่งนี้ถูกเลือกตามค่าเริ่มต้น
จุดสิ้นสุดอื่นๆ ทั้งหมดจะชี้ไปที่การผลิต
RTL - เปิดตัวแอปในสถานที่ RTL โดยใช้ -AppleLocale อาร์กิวเมนต์การเปิดตัว สิ่งนี้ถูกใช้โดยวิศวกรในโหมดดีบักเท่านั้น
การทดสอบประสิทธิภาพ - นี่เป็นรูปแบบที่ซ้ํากันของวิกิพีเดีย แต่ใช้การกําหนดค่า Release ในขั้นตอน Run แทน Debug เราใช้โครงร่างนี้เมื่อเราทําการทดสอบประสิทธิภาพด้วยตนเองโดยเป็นส่วนหนึ่งของรายการตรวจสอบก่อนเผยแพร่ของเรา
WMF - รวมตรรกะของแอปที่ใช้ร่วมกันระหว่างแอปหลักและส่วนขยาย (วิดเจ็ตการแจ้งเตือน)
อัปเดตการแปลเป็นภาษาท้องถิ่น - ครอบคลุมอยู่ใน [เอกสารการแปลเป็นภาษาท้องถิ่น](docs/localization.md)
อัปเดตภาษา - สําหรับการเพิ่มภาษาวิกิพีเดียใหม่หรือปรับปรุงการกําหนดค่าภาษา ครอบคลุมอยู่ใน [เอกสารภาษา](docs/languages.md)
{{name}}วิดเจ็ต, {{name}}การแจ้งเตือน, {{name}}สติกเกอร์ - ส่วนขยายสําหรับวิดเจ็ต การแจ้งเตือน และสติกเกอร์
บูรณาการอย่างต่อเนื่อง
ครอบคลุมอยู่ใน [เอกสาร CI](docs/ci.md)

การพัฒนาเว็บ
มุมมองบทความและส่วนประกอบอื่นๆ หลายประการของแอปขึ้นอยู่กับส่วนประกอบของเว็บ คําแนะนําในการทํางานกับส่วนประกอบเหล่านี้ครอบคลุมอยู่ใน [เอกสารการพัฒนาเว็บ](docs/web_dev.md)

